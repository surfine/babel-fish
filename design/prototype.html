<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Rosetta 設計稿</title>
<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Helvetica Neue","Noto Sans TC",sans-serif;
  --is-dark:0;
  --bg:#ffffff; --bg-2:#f6f6f7; --bg-3:#ececef;
  --side:#1e2130; --side-2:#2a2e40; --side-text:#c3c7d3; --side-strong:#ffffff; --side-active:#39405a;
  --text:#1d1c1f; --text-2:#56555c; --text-3:#8b8a92;
  --line:#e7e6eb; --line-2:#d8d7de;
  --accent:#0f7f74; --accent-2:#0b665d; --accent-soft:#e2f3f0; --accent-line:rgba(15,127,116,.38); --on-accent:#ffffff;
  --trans:#3d5f5a;
  --warn:#8a5a00; --warn-soft:#fff3d1;
  --ok:#17733a; --ok-soft:#e4f5e8;
  --info:#1d5fbf; --info-soft:#e8f0fd;
  --mention:#1d5fbf; --mention-soft:#e8f0fd;
  --pin:#d1347f; --pin-soft:#fde7f1;
  --tip-bg:#1d1f28; --tip-text:#f2f2f5;
  --proto:#f3f0e9; --proto-text:#4a463d;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 10px 30px rgba(0,0,0,.09);
  --shadow-sm:0 1px 2px rgba(0,0,0,.08),0 3px 10px rgba(0,0,0,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --is-dark:1;
    --bg:#17181c; --bg-2:#1f2126; --bg-3:#2a2d34;
    --side:#101115; --side-2:#1b1d23; --side-text:#a6aab6; --side-strong:#ffffff; --side-active:#2b3040;
    --text:#e7e7eb; --text-2:#b2b3bb; --text-3:#7f818b;
    --line:#2b2e35; --line-2:#3a3d46;
    --accent:#3cbcab; --accent-2:#62d2c3; --accent-soft:#15302c; --accent-line:rgba(60,188,171,.42); --on-accent:#05211d;
    --trans:#9cc8c1;
    --warn:#e6b84a; --warn-soft:#382d12;
    --ok:#5bd06d; --ok-soft:#163022;
    --info:#8ab4f8; --info-soft:#1c2940;
    --mention:#8ab4f8; --mention-soft:#1c2940;
    --pin:#f06aa8; --pin-soft:#3a1a2a;
    --tip-bg:#33363f; --tip-text:#f2f2f5;
    --proto:#0c0d10; --proto-text:#a9a59b;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.45);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4),0 3px 10px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --is-dark:1;
  --bg:#17181c; --bg-2:#1f2126; --bg-3:#2a2d34;
  --side:#101115; --side-2:#1b1d23; --side-text:#a6aab6; --side-strong:#ffffff; --side-active:#2b3040;
  --text:#e7e7eb; --text-2:#b2b3bb; --text-3:#7f818b;
  --line:#2b2e35; --line-2:#3a3d46;
  --accent:#3cbcab; --accent-2:#62d2c3; --accent-soft:#15302c; --accent-line:rgba(60,188,171,.42); --on-accent:#05211d;
  --trans:#9cc8c1;
  --warn:#e6b84a; --warn-soft:#382d12;
  --ok:#5bd06d; --ok-soft:#163022;
  --info:#8ab4f8; --info-soft:#1c2940;
  --mention:#8ab4f8; --mention-soft:#1c2940;
  --pin:#f06aa8; --pin-soft:#3a1a2a;
  --tip-bg:#33363f; --tip-text:#f2f2f5;
  --proto:#0c0d10; --proto-text:#a9a59b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.45);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4),0 3px 10px rgba(0,0,0,.3);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,.idiom:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{flex:none}

/* 設計稿外框 */
.protobar{height:38px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 14px;background:var(--proto);color:var(--proto-text);font-size:13px;border-bottom:1px solid var(--line)}
.pb-left{display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap}
.pb-left b{color:var(--text)}
.pb-sub{opacity:.75;overflow:hidden;text-overflow:ellipsis}
.pb-right{display:flex;gap:6px}
.pb-btn{border:1px solid var(--line-2);background:var(--bg);border-radius:6px;padding:2px 10px;font-size:12.5px}
.pb-btn[aria-pressed="true"]{background:var(--pin);border-color:var(--pin);color:#fff}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);height:calc(100vh - 38px);height:calc(100dvh - 38px)}
.app.annot{grid-template-columns:248px minmax(0,1fr) 330px}

/* 側欄 */
.sidebar{background:var(--side);color:var(--side-text);display:flex;flex-direction:column;min-height:0;overflow:auto;padding:14px 10px 12px}
.ws{display:flex;align-items:center;gap:6px;padding:2px 8px 12px;color:var(--side-strong);font-weight:800;font-size:17px}
.rosetta-on{display:flex;align-items:center;gap:8px;margin:0 4px 12px;padding:8px 10px;border-radius:8px;background:var(--side-2);font-size:12.5px;line-height:1.35}
.rosetta-on b{color:var(--side-strong);font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:#3cbcab;box-shadow:0 0 0 3px rgba(60,188,171,.22)}
.sec{font-size:12px;padding:12px 8px 4px;opacity:.7}
.item{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;font-size:14.5px}
.item.active{background:var(--side-active);color:var(--side-strong);font-weight:600}
.item .av{width:20px;height:20px;border-radius:5px;font-size:9.5px}
.side-foot{margin-top:auto;padding:12px 8px 2px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;opacity:.75;line-height:1.6}

/* 頻道 */
.channel{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.ch-head{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding:10px 20px;border-bottom:1px solid var(--line)}
.ch-title{display:flex;align-items:center;gap:6px;font-weight:800;font-size:17px}
.members{font-weight:400;font-size:13px;color:var(--text-3);margin-left:6px}
.ch-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--bg-3);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:4px 10px;border-radius:6px;font-size:13px;color:var(--text-2);white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--bg);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.14);font-weight:600}
.chip-wrap{display:inline-flex}
.chip{border:1px solid var(--line-2);background:var(--bg);border-radius:999px;padding:4px 11px;font-size:13px;color:var(--text-2);display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.chip:hover,.chip[aria-expanded="true"]{border-color:var(--accent-line);color:var(--text)}

.feed{flex:1;min-height:0;overflow:auto;padding:12px 0 8px}
.catchup{margin:2px 20px 14px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg-2);font-size:14px}
.catchup h4{margin:0 0 4px;font-size:13px;color:var(--accent-2);display:flex;gap:6px;align-items:center}
.catchup p{margin:0;color:var(--text-2)}
.cu-actions{margin-top:8px;display:flex;gap:14px}
.link-btn{border:0;background:none;padding:0;color:var(--accent-2);font-size:13px;font-weight:600}
.link-btn:hover{text-decoration:underline}
.daysep{display:flex;align-items:center;gap:10px;margin:4px 20px 8px;color:var(--text-2);font-size:12.5px;font-weight:600}
.daysep::before,.daysep::after{content:"";flex:1;height:1px;background:var(--line)}
.daysep span{border:1px solid var(--line);border-radius:999px;padding:2px 12px}

.msg{display:grid;grid-template-columns:36px minmax(0,1fr);column-gap:10px;padding:6px 20px;position:relative}
.msg.cont{padding-top:1px}
.msg:hover{background:var(--bg-2)}
.avatar{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;letter-spacing:.02em}
.cont .avatar{visibility:hidden;height:0}
.body{display:flex;flex-direction:column;min-width:0}
.meta{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px;line-height:1.3;margin-bottom:2px}
.meta b{font-weight:800}
.meta time{font-size:12px;color:var(--text-3)}
.en{overflow-wrap:anywhere}
.en + .en{margin-top:2px}
.zh{margin-top:3px;padding-left:10px;border-left:2px solid var(--accent-line);color:var(--trans);font-size:14.5px;overflow-wrap:anywhere}
.mention{background:var(--mention-soft);color:var(--mention);border-radius:4px;padding:0 3px}
.idiom{border-bottom:1.5px dotted var(--accent);cursor:help}
.quote{display:flex;flex-direction:column;margin:6px 0 2px;padding:2px 0 2px 12px;border-left:4px solid var(--line-2)}
.zh.own{border-left-color:var(--line-2);color:var(--text-2)}
.own-label{font-size:11px;font-weight:700;color:var(--text-3);margin-right:6px}
.sent-tag{font-size:11px;font-weight:600;color:var(--accent-2);background:var(--accent-soft);padding:1px 7px;border-radius:999px}
.msg.pending .en,.msg.pending .zh{opacity:.55}
.undo{font-size:12px;color:var(--text-3);display:flex;gap:8px;align-items:center}

/* 閱讀模式 */
.feed[data-mode="zh"] .meta{order:0}
.feed[data-mode="zh"] .zh{order:1;border-left:0;padding-left:0;margin-top:0;color:var(--text);font-size:15px}
.feed[data-mode="zh"] .en{order:2;font-size:12.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.feed[data-mode="zh"] .en.open{white-space:normal}
.feed[data-mode="zh"] .quote{order:3}
.feed[data-mode="zh"] .undo{order:4}
.feed[data-mode="en"] .zh{display:none}
.feed[data-mode="en"] .msg.peek .zh{display:block}
.feed[data-mode="en"] .msg{cursor:pointer}
.feed[data-mode="en"] .msg:not(.peek):hover .body > .en:last-of-type::after{content:"　點一下看翻譯";color:var(--text-3);font-size:12px}

.actions{position:absolute;top:-12px;right:20px;display:none;background:var(--bg);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow-sm);padding:2px;z-index:3}
.msg:hover .actions,.msg:focus-within .actions{display:flex}
.actions button{border:0;background:none;padding:3px 9px;font-size:12.5px;border-radius:6px;color:var(--text-2);display:flex;gap:5px;align-items:center}
.actions button:hover{background:var(--bg-3);color:var(--text)}

/* 輸入區 */
.composer-wrap{padding:0 20px 16px;display:flex;flex-direction:column;gap:10px}
.composer{border:1px solid var(--line-2);border-radius:12px;background:var(--bg);transition:border-color .15s,box-shadow .15s}
.composer:focus-within{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
.ctx-row{display:flex;align-items:center;gap:6px;padding:8px 12px 0;flex-wrap:wrap}
.ctx{font-size:12px;color:var(--text-3);display:inline-flex;align-items:center;gap:5px;background:var(--bg-2);border-radius:6px;padding:2px 8px;max-width:100%}
.ctx.reply{color:var(--text-2);background:var(--accent-soft)}
.ctx .ex{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34ch}
.ctx .x{border:0;background:none;padding:0 0 0 2px;color:var(--text-3);line-height:1}
.lang{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--accent-2);letter-spacing:.05em}
textarea{display:block;width:100%;border:0;outline:0;resize:none;background:transparent;color:var(--text);font:15px/1.5 var(--font);padding:8px 12px 4px;min-height:48px;max-height:180px}
textarea::placeholder{color:var(--text-3)}
.tools{display:flex;align-items:center;gap:2px;padding:2px 8px 8px}
.icon-btn{border:0;background:none;width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--text-3)}
.icon-btn:hover{background:var(--bg-3);color:var(--text)}
.spacer{flex:1}
.kbd{font-size:11.5px;color:var(--text-3);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:0 5px;white-space:nowrap}
.btn{border:1px solid var(--line-2);background:var(--bg);border-radius:8px;padding:6px 13px;font-size:13.5px;font-weight:600;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.btn:hover{background:var(--bg-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{border-color:transparent;background:none;color:var(--text-2)}
.btn.ghost:hover{background:var(--bg-2);color:var(--text)}

/* 審閱卡 */
.review{border:1px solid var(--accent-line);border-radius:14px;background:var(--bg);box-shadow:var(--shadow);max-height:min(60vh,560px);overflow:auto;outline:none;animation:rise .22s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rv-head{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;padding:12px 16px 8px;position:sticky;top:0;background:var(--bg);z-index:2}
.rv-title{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--text)}
.rv-title .ic{color:var(--accent)}
.rv-title .muted{font-weight:400;color:var(--text-3);font-size:12.5px}
.badge{font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;display:inline-flex;gap:6px;align-items:center}
.badge.warn{color:var(--warn);background:var(--warn-soft)}
.badge.info{color:var(--info);background:var(--info-soft)}
.rv-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;padding:2px 16px 12px}
.label{font-size:11.5px;font-weight:700;color:var(--text-3);letter-spacing:.04em;margin-bottom:5px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.label span{font-weight:400;letter-spacing:0}
.bubble{background:var(--bg-2);border:1px solid transparent;border-radius:10px;padding:8px 12px;margin-bottom:6px;font-size:15px;outline:none;overflow-wrap:anywhere}
.bubble:hover{border-color:var(--line-2)}
.bubble:focus{border-color:var(--accent-line);background:var(--bg)}
.split{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;font-size:12.5px;color:var(--text-3);margin:2px 0 12px}
.back{border-top:1px dashed var(--line-2);padding-top:10px}
.back p{margin:0 0 8px;color:var(--text-2);font-size:14.5px}
.back mark{background:var(--warn-soft);color:inherit;border-bottom:1.5px solid var(--warn);padding:0 1px}
.check{display:inline-flex;gap:6px;align-items:flex-start;font-size:12.5px;padding:4px 9px;border-radius:6px;line-height:1.45}
.check.ok{color:var(--ok);background:var(--ok-soft)}
.check.warn{color:var(--warn);background:var(--warn-soft)}
.check.info{color:var(--info);background:var(--info-soft)}
.check.stale{color:var(--text-2);background:var(--bg-3)}
.notes{background:var(--bg-2);border-radius:10px;padding:10px 12px;font-size:13.5px;align-self:start}
.notes ol{margin:0;padding-left:18px}
.notes li{margin:0 0 8px;color:var(--text-2)}
.notes li:last-child{margin-bottom:0}
.notes li b{color:var(--text);font-weight:600}
.refine{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:0 16px 12px}
.refine input{flex:1 1 220px;min-width:0;border:1px solid var(--line-2);border-radius:8px;padding:6px 10px;background:var(--bg);color:var(--text);font:13.5px var(--font);outline:none}
.refine input:focus{border-color:var(--accent-line)}
.sugg{border:1px dashed var(--line-2);background:none;border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--text-2);white-space:nowrap}
.sugg:hover{border-style:solid;border-color:var(--accent-line);color:var(--text)}
.applied{font-size:12.5px;color:var(--accent-2);width:100%}
.rv-foot{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:10px 16px 12px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--bg);z-index:2}
.send-area{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.as-who{font-size:12px;color:var(--text-3)}
.steps{padding:16px 18px;display:grid;gap:9px;font-size:13.5px;color:var(--text-3)}
.s{display:flex;gap:9px;align-items:center}
.s.done{color:var(--text-2)}
.s .ic{width:15px;height:15px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center}
.s.run .ic{border-color:var(--accent);border-right-color:transparent;animation:spin .7s linear infinite}
.s.done .ic{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
@keyframes spin{to{transform:rotate(360deg)}}
.fade{animation:fade .25s ease-out}
@keyframes fade{from{opacity:.35}to{opacity:1}}

/* 浮層 */
.tip{position:fixed;z-index:60;max-width:300px;background:var(--tip-bg);color:var(--tip-text);border-radius:10px;padding:9px 12px;font-size:13px;line-height:1.55;box-shadow:0 10px 30px rgba(0,0,0,.28);pointer-events:none}
.tip b{font-weight:700}
.panel{position:fixed;z-index:55;width:330px;max-width:calc(100vw - 32px);background:var(--bg);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;font-size:13.5px}
.panel h4{margin:0;font-size:14.5px}
.panel .sub{margin:2px 0 12px;color:var(--text-3);font-size:12.5px}
.stat{display:grid;grid-template-columns:96px 1fr 38px;gap:10px;align-items:center;margin-bottom:7px;color:var(--text-2)}
.bar{height:6px;border-radius:3px;background:var(--bg-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.stat b{text-align:right;font-variant-numeric:tabular-nums;color:var(--text)}
.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 10px;margin:12px 0;color:var(--text-2)}
.kv dt{color:var(--text-3)}
.kv dd{margin:0}
.switch{display:flex;gap:8px;align-items:center;margin-top:6px;color:var(--text-2)}
.switch input{accent-color:var(--accent);width:15px;height:15px;margin:0}
.gloss{width:100%;border-collapse:collapse;margin-bottom:10px}
.gloss td{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:top}
.gloss td:first-child{font-weight:600;width:48%;padding-right:10px}
.gloss td:last-child{color:var(--text-2)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:70;background:var(--tip-bg);color:var(--tip-text);padding:8px 14px;border-radius:10px;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:rise .2s ease-out;max-width:calc(100vw - 32px)}

/* 設計註解 */
.has-pin{position:relative}
.pin{position:absolute;top:-9px;right:-9px;width:20px;height:20px;border-radius:50%;background:var(--pin);color:#fff;font-size:11px;font-weight:700;border:2px solid var(--bg);display:grid;place-items:center;z-index:6;padding:0;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.25);line-height:1}
.msg > .pin{top:4px;right:12px}
.app:not(.annot) .pin{display:none}
.has-pin.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--pin)}100%{box-shadow:0 0 0 3px transparent}}
.drawer{border-left:1px solid var(--line);background:var(--bg-2);overflow:auto;padding:16px 14px}
.drawer h3{margin:0 0 6px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.drawer .intro{font-size:13px;color:var(--text-2);margin:0 0 12px}
.drawer ol{list-style:none;padding:0;margin:0;display:grid;gap:4px}
.drawer li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:13.5px;color:var(--text-2);padding:8px;border-radius:8px;cursor:pointer}
.drawer li:hover{background:var(--bg-3)}
.drawer li.absent{opacity:.6}

function fmt(t, idioms = []) {
  let h = esc(t).replace(/@dana\b/g, '<span class="mention">@dana</span>');
  for (const k of idioms) {
    const ek = esc(k);
    h = h.replace(ek, `<span class="idiom" tabindex="0" data-idiom="${ek}">${ek}</span>`);
  }
  return h;
}

function msgHTML(m) {

  return `<div class="msg${m.cont ? ' cont' : ''}" data-id="${m.id}">
    <div class="avatar" style="background:${p.color}">${p.ini}</div>
    <div class="body">${meta}<div class="en">${fmt(m.en, m.idioms)}</div><div class="zh">${fmt(m.zh)}</div>${quote}</div>

  const w = box.offsetWidth, h = box.offsetHeight;
  let x = alignRight ? r.right - w : r.left + r.width / 2 - w / 2;
  x = Math.min(Math.max(8, x), innerWidth - w - 8);
  let y = r.bottom + gap;
  if (y + h > innerHeight - 8) y = Math.max(8, r.top - h - gap);
  box.style.left = x + 'px';
  box.style.top = y + 'px';
}
function showTip(el, html) { tip.innerHTML = html; tip.hidden = false; place(el, tip); }
function hideTip() { tip.hidden = true; }

const panel = $('#panel');
let panelFor = null;
function openPanel(btn, html) {
  if (panelFor === btn) return closePanel();
  closePanel();
  panel.innerHTML = html;
  panel.hidden = false;
  place(btn, panel, 8, true);
  panelFor = btn;
  btn.setAttribute('aria-expanded', 'true');
}
function closePanel() {
  if (panelFor) panelFor.setAttribute('aria-expanded', 'false');
  panel.hidden = true;
  panelFor = null;
}

let toastTimer = null;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
}

const STYLE_PANEL = `<h4>這個頻道的寫法</h4><p class="sub">依最近 200 則訊息統計，每天更新</p>
  <div class="stat"><span>小寫開頭</span><div class="bar"><i style="width:86%"></i></div><b>86%</b></div>
  <div class="stat"><span>句尾不加句號</span><div class="bar"><i style="width:91%"></i></div><b>91%</b></div>
  <div class="stat"><span>連發短訊息</span><div class="bar"><i style="width:68%"></i></div><b>68%</b></div>
  <dl class="kv"><dt>平均長度</dt><dd>一則約 11 個字</dd><dt>常見縮寫</dt><dd>fwiw · tbh · prob · imo</dd><dt>emoji</dt><dd>很少打在字裡，多半用表情回應</dd></dl>
  <label class="switch"><input type="checkbox" checked> 潤色時跟著這個語氣</label>
  <label class="switch"><input type="checkbox" checked> 也參考我過去 50 則英文訊息的用字</label>`;

const GLOSS_PANEL = `<h4>術語表</h4><p class="sub">翻譯和潤色都照這張表；產品名一律用 Apple 官方寫法</p>
  <table class="gloss">
    <tr><td>Find My</td><td>「尋找」</td></tr>
    <tr><td>Precision Finding</td><td>精確尋找</td></tr>
    <tr><td>Control Center</td><td>控制中心</td></tr>
    <tr><td>AirPods Pro</td><td>不翻譯</td></tr>
    <tr><td>iPadOS 27、beta 4</td><td>不翻譯，保留大小寫</td></tr>
  </table>
  <button class="link-btn">＋ 新增詞條</button>`;

/* ---------- 脈絡與草稿 ---------- */
const draft = $('#draft');
function autosize() { draft.style.height = 'auto'; draft.style.height = Math.min(draft.scrollHeight, 180) + 'px'; }

function renderCtx() {
  const r = state.reply;
  $('#ctxRow').innerHTML = `<span class="ctx">參考最近 20 則對話</span>`
    + (r ? `<span class="ctx reply">回應 ${esc(r.who)}：<span class="ex">${esc(r.text)}</span><button class="x" data-act="clear-reply" aria-label="取消回應">✕</button></span>` : '')
    + `<span class="lang">中 → EN</span>`;
  applyPins();
}

/* ---------- 審閱卡 ---------- */
const review = $('#review');

function polish() {
  const text = draft.value.trim();
  if (!text) { draft.focus(); toast('先用中文寫點什麼'); return; }
  Object.assign(state, {
    review: true, loading: true, armed: false, variant: 'natural', tone: 'natural', split: true,
    applied: null, staleZh: false, staleEn: false, draftAtPolish: text, custom: text !== SAMPLE,
  });
  const steps = [
    '讀取最近 20 則對話' + (state.reply ? '，和你要回應的那則' : ''),
    '套用頻道語氣（小寫、短句、連發）',
    '照術語表保留產品名',
    '潤色成英文',
    '回譯並比對意思',
  ];
  review.hidden = false;
  let i = 0;
  const draw = () => {
    review.innerHTML = `<div class="rv-head"><div class="rv-title"><span class="ic">${ICON.spark}</span>潤色中…</div></div>
      <div class="steps">${steps.map((s, j) => `<div class="s ${j < i ? 'done' : j === i ? 'run' : ''}"><span class="ic">${j < i ? ICON.check : ''}</span>${s}</div>`).join('')}</div>`;
  };
  draw();
  const tick = setInterval(() => {
    i++;
    if (i >= steps.length) {
      clearInterval(tick);
      state.loading = false;
      renderReview();
      review.focus({ preventScroll: true });
      return;
    }
    draw();
  }, 260);
}

function parts() {
  const v = V[state.variant];
  return v.merged && !state.split ? [v.merged] : v.bubbles;
}

function checkHTML() {
  if (state.rechecking) return `<span class="check stale">檢查中…</span>`;
  if (state.staleEn) return `<span class="check stale">你改了英文，上面的回譯還是舊的 · <button class="link-btn" data-act="recheck">重新檢查</button></span>`;
  const [kind, text] = V[state.variant].check;
  const mark = kind === 'ok' ? '✓' : kind === 'warn' ? '⚠' : 'ℹ';
  return `<span class="check ${kind}">${mark} ${text}</span>`;
}

function renderReview(anim = false) {
  const v = V[state.variant];
  const ps = parts();
  const n = ps.length;
  const tones = [['casual', '更隨意'], ['natural', '像這個頻道'], ['formal', '更正式']];
  const badges = (state.staleZh ? `<span class="badge warn">中文改過了 · <button class="link-btn" data-act="repolish">重新潤色</button></span>` : '')
    + (state.custom ? `<span class="badge info">設計稿只有一組預寫範例，接上模型後會依你的內容產生</span>` : '');
  review.innerHTML = `
    <div class="rv-head">
      <div class="rv-title"><span class="ic">${ICON.spark}</span>英文草稿<span class="muted">你按送出之前不會發出去</span>${badges}</div>
      <div class="seg seg-tone" role="tablist" aria-label="語氣">${tones.map(([k, l]) => `<button role="tab" data-tone="${k}" aria-selected="${state.tone === k}">${l}</button>`).join('')}</div>
    </div>
    <div class="rv-grid${anim ? ' fade' : ''}">
      <div class="rv-main">
        <div class="label">會送出的英文<span>${n > 1 ? `分成 ${n} 則` : '1 則'} · 可以直接改</span></div>
        ${ps.map((t, i) => `<div class="bubble" contenteditable="true" spellcheck="true" data-i="${i}">${esc(t)}</div>`).join('')}
        ${v.merged ? `<div class="split">${state.split ? '這個頻道習慣連發短訊息，所以拆成兩則' : '已合併成一則'} · <button class="link-btn" data-act="toggle-split">${state.split ? '合併成一則' : '拆成兩則'}</button></div>` : '<div class="split"></div>'}
        <div class="back">
          <div class="label">回譯<span>把英文翻回中文，確認意思沒跑掉</span></div>
          <p>${v.back}</p>
          ${checkHTML()}
        </div>
      </div>
      <aside class="notes">
        <div class="label">為什麼這樣寫</div>
        <ol>${v.notes.map(([a, b]) => `<li><b>${esc(a)}</b>　${esc(b)}</li>`).join('')}</ol>
      </aside>
    </div>
    <div class="refine">
      <input id="refineInput" placeholder="還想怎麼改？例如：短一點、熱情一點" aria-label="調整指示">
      <button class="sugg" data-refine="short">短一點</button>
      <button class="sugg" data-refine="warm">熱情一點</button>
      <button class="sugg" data-refine="natural">別用縮寫</button>
      ${state.applied ? `<span class="applied">已套用：${esc(state.applied)} · <button class="link-btn" data-act="unrefine">還原</button></span>` : ''}
    </div>
    <div class="rv-foot">
      <button class="btn ghost" data-act="cancel">取消</button>
      <button class="btn ghost" data-act="edit-zh">改中文</button>
      <div class="send-area">
        <span class="as-who">以 Mei Lin 的身分送到 newsroom</span>
        <span class="kbd">⌘↩</span>
        <button class="btn primary" data-act="send" ${state.armed ? '' : 'disabled'}>送出${n > 1 ? ` ${n} 則` : ''}</button>
      </div>
    </div>`;
  if (!state.armed) {
    clearTimeout(armTimer);
    armTimer = setTimeout(() => {
      state.armed = true;
      const b = $('[data-act="send"]', review);
      if (b) b.disabled = false;
    }, 800);
  }
  applyPins();
}

function rearm() { state.armed = false; }

function setVariant(variant, { tone, applied = null } = {}) {
  state.variant = variant;
  if (tone) state.tone = tone;
  state.applied = applied;
  state.split = true;
  state.staleEn = false;
  rearm();
  review.innerHTML = `<div class="steps"><div class="s run"><span class="ic"></span>${applied ? `照「${esc(applied)}」重寫…` : '換個語氣重寫…'}</div></div>`;
  setTimeout(() => renderReview(true), 420);
}

function refine(text) {
  const t = text.trim();
  if (!t) return;
  const variant = /熱情|熱絡|興奮/.test(t) ? 'warm' : /縮寫|完整/.test(t) ? 'natural' : 'short';
  setVariant(variant, { applied: t });
}

function closeReview() {
  review.hidden = true;
  review.innerHTML = '';
  state.review = false;
  state.loading = false;
  clearTimeout(armTimer);
  applyPins();
}

function send() {
  if (!state.review || state.loading || !state.armed) return;
  const texts = $$('.bubble', review).map(b => b.innerText.trim()).filter(Boolean);
  if (!texts.length) { toast('英文是空的'); return; }
  lastReview = { ...state, texts, draftValue: draft.value };
  const s = { id: 's' + Date.now(), time: '早上 8:12', texts, draft: state.draftAtPolish, pending: true, left: 5 };
  SENT.push(s);
  closeReview();
  draft.value = '';
  autosize();
  state.reply = null;
  renderCtx();
  renderFeed();
  clearInterval(sendTimer);
  sendTimer = setInterval(() => {
    s.left--;
    if (s.left <= 0) {
      clearInterval(sendTimer);
      s.pending = false;
      renderFeed();
      toast(`已送到 newsroom（${texts.length} 則）`);
      return;
    }
    const u = $(`[data-sent="${s.id}"] [data-act="undo"]`);
    if (u) u.textContent = `撤回（${s.left}）`;
  }, 1000);
}

function undo() {
  clearInterval(sendTimer);
  const s = SENT.pop();
  if (!s || !lastReview) return;
  const { texts, draftValue, ...rest } = lastReview;
  Object.assign(state, rest, { review: true, loading: false, armed: false });
  draft.value = draftValue;
  autosize();
  renderCtx();
  renderFeed();
  review.hidden = false;
  renderReview();
  $$('.bubble', review).forEach((b, i) => { if (texts[i] != null) b.textContent = texts[i]; });
  toast('已撤回，草稿還在');
}

/* ---------- 設計註解 ---------- */
function applyPins() {
  $$('.pin').forEach(p => p.remove());
  NOTES.forEach((n, i) => {
    const el = $(n.sel);
    if (!el) return;
    el.classList.add('has-pin');
    const b = document.createElement('span');
    b.className = 'pin';
    b.setAttribute('role', 'button');
    b.tabIndex = 0;
    b.dataset.note = i;
    b.textContent = i + 1;
    b.setAttribute('aria-label', '設計註解 ' + (i + 1));
    el.appendChild(b);
  });
  $('#drawerList').innerHTML = NOTES.map((n, i) => {
    const present = !!$(n.sel);
    return `<li data-i="${i}" class="${present ? '' : 'absent'}"><span class="pin-n">${i + 1}</span><div>${n.t}${!present && n.when ? `<small>${n.when}</small>` : ''}</div></li>`;
  }).join('');
}

function flash(el) {
  if (!el) return;
  el.classList.remove('flash');
  void el.offsetWidth;
  el.classList.add('flash');
}

function setAnnot(on) {
  $('#app').classList.toggle('annot', on);
  $('#drawer').hidden = !on;
  $('#annotBtn').setAttribute('aria-pressed', on);
}

/* ---------- 事件 ---------- */
$$('.seg-modes button').forEach(b => b.addEventListener('click', () => {
  $$('.seg-modes button').forEach(x => x.setAttribute('aria-selected', x === b));
  $('#feed').dataset.mode = b.dataset.mode;
  $$('.msg.peek').forEach(m => m.classList.remove('peek'));
}));

$('#styleChip').addEventListener('click', e => { e.stopPropagation(); openPanel(e.currentTarget, STYLE_PANEL); });
$('#glossChip').addEventListener('click', e => { e.stopPropagation(); openPanel(e.currentTarget, GLOSS_PANEL); });
document.addEventListener('click', e => {
  if (!panel.hidden && !panel.contains(e.target)) closePanel();
});

$('#feed').addEventListener('click', e => {
  const act = e.target.closest('[data-act]');
  const msg = e.target.closest('.msg');
  if (act) {
    const a = act.dataset.act;
    if (a === 'close-catchup') { state.catchup = false; renderFeed(false); }
    else if (a === 'undo') undo();
    else if (msg && msg.dataset.id) {
      const m = MSGS.find(x => x.id === +msg.dataset.id);
      if (a === 'reply') {
        state.reply = { who: PEOPLE[m.who].name.split(' ')[0], text: m.en };
        renderCtx();
        if (state.review && !state.loading) { state.staleZh = true; renderReview(); }
        draft.focus();
      } else if (a === 'explain') {
        const list = (m.idioms || []).map(k => IDIOMS[k]).join('<br><br>');
        showTip(act, list || '這則沒有特別的俚語或縮寫，照字面理解就可以。');
        setTimeout(hideTip, 3200);
      } else if (a === 'retranslate') {
        toast('會用較強的模型重新翻譯這則（設計稿不會真的呼叫）');
      }
    }
    return;
  }
  if (e.target.closest('.idiom')) return;
  const mode = $('#feed').dataset.mode;
  if (mode === 'zh' && e.target.closest('.en')) { e.target.closest('.en').classList.toggle('open'); return; }
  if (mode === 'en' && msg) msg.classList.toggle('peek');
});

$('#feed').addEventListener('mouseover', e => {
  const i = e.target.closest('.idiom');
  if (i) showTip(i, IDIOMS[i.dataset.idiom] || '');
});
$('#feed').addEventListener('mouseout', e => { if (e.target.closest('.idiom')) hideTip(); });
$('#feed').addEventListener('focusin', e => { const i = e.target.closest('.idiom'); if (i) showTip(i, IDIOMS[i.dataset.idiom] || ''); });
$('#feed').addEventListener('focusout', e => { if (e.target.closest('.idiom')) hideTip(); });
$('#feed').addEventListener('scroll', hideTip, { passive: true });

$('#ctxRow').addEventListener('click', e => {
  if (e.target.closest('[data-act="clear-reply"]')) { state.reply = null; renderCtx(); }
});

draft.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && !e.isComposing) { e.preventDefault(); polish(); }
});
draft.addEventListener('input', () => {
  autosize();
  if (state.review && !state.loading && !state.staleZh && draft.value.trim() !== state.draftAtPolish) {
    state.staleZh = true;
    renderReview();
  }
});
$('#polishBtn').addEventListener('click', polish);

review.addEventListener('click', e => {
  const tone = e.target.closest('[data-tone]');
  if (tone) { if (tone.dataset.tone !== state.tone || state.applied) setVariant(tone.dataset.tone, { tone: tone.dataset.tone }); return; }
  const r = e.target.closest('[data-refine]');
  if (r) { setVariant(r.dataset.refine, { applied: r.textContent }); return; }
  const act = e.target.closest('[data-act]');
  if (!act) return;
  const a = act.dataset.act;
  if (a === 'send') send();
  else if (a === 'cancel') { closeReview(); draft.focus(); }
  else if (a === 'edit-zh') { draft.focus(); draft.setSelectionRange(draft.value.length, draft.value.length); }
  else if (a === 'repolish') polish();
  else if (a === 'toggle-split') { state.split = !state.split; state.staleEn = false; rearm(); renderReview(true); }
  else if (a === 'unrefine') setVariant(state.tone, { tone: state.tone });
  else if (a === 'recheck') {
    state.rechecking = true; renderReview();
    setTimeout(() => { state.rechecking = false; state.staleEn = false; renderReview(); }, 700);
  }
});
review.addEventListener('input', e => {
  if (e.target.classList.contains('bubble') && !state.staleEn) {
    state.staleEn = true;
    const back = $('.back .check', review);
    if (back) back.outerHTML = checkHTML();
  }
});
review.addEventListener('keydown', e => {
  if (e.target.id === 'refineInput' && e.key === 'Enter' && !e.isComposing && !(e.metaKey || e.ctrlKey)) {
    e.preventDefault(); refine(e.target.value);
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    hideTip(); closePanel();
    if (state.review && document.activeElement !== draft) closeReview();
    return;
  }
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && !e.isComposing && state.review && document.activeElement !== draft) {
    e.preventDefault(); send();
  }
});

/* 設計註解互動 */
document.addEventListener('mouseover', e => {
  const p = e.target.closest('.pin');
  if (p) showTip(p, NOTES[p.dataset.note].t);
});
document.addEventListener('mouseout', e => { if (e.target.closest('.pin')) hideTip(); });
document.addEventListener('click', e => {
  const p = e.target.closest('.pin');
  if (p) {
    e.stopPropagation();
    const li = $(`#drawerList li[data-i="${p.dataset.note}"]`);
    if (li) { li.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); flash(li); }
  }
}, true);
$('#drawerList').addEventListener('click', e => {
  const li = e.target.closest('li');
  if (!li) return;
  const el = $(NOTES[li.dataset.i].sel);
  if (el) { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); flash(el); }
  else toast(NOTES[li.dataset.i].when || '目前畫面上沒有');
});
$('#annotBtn').addEventListener('click', () => setAnnot(!$('#app').classList.contains('annot')));
$('#drawerClose').addEventListener('click', () => setAnnot(false));

/* 主題 */
function isDark() { return getComputedStyle(document.documentElement).getPropertyValue('--is-dark').trim() === '1'; }
function themeLabel() { $('#themeBtn').textContent = isDark() ? '淺色' : '深色'; }
try { const t = localStorage.getItem('rosetta-theme'); if (t) document.documentElement.dataset.theme = t; } catch (_) {}
$('#themeBtn').addEventListener('click', () => {
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('rosetta-theme', next); } catch (_) {}
  themeLabel();
});
$('#resetBtn').addEventListener('click', () => location.reload());

/* 啟動 */
draft.value = SAMPLE;
renderCtx();
renderFeed();
requestAnimationFrame(autosize);
addEventListener('resize', autosize);
themeLabel();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', themeLabel);
</script>
</body>
</html>
